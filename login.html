<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | Guau & Miau</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link rel="stylesheet" href="assets/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js" defer></script>
  </head>
  <body>
        <header class="navbar-header bg-white border-bottom py-2 px-4 shadow-sm">
      <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid px-0">
          <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <img src="assets/logo.png" alt="Logo" width="40" height="40" />
            <span class="fw-bold text-dark">Guau & Miau</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active fw-semibold" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="login.html">Login</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="registro.html">Registro</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="d-flex justify-content-center align-items-center min-vh-75 py-5">
      <div class="card login-card border shadow-sm w-100" style="max-width: 450px">
        <div class="card-header text-center bg-secondary-subtle border-bottom py-2">
          <span class="fw-bold text-dark">Inicio de Sesión</span>
        </div>
        <div class="card-body p-4">
          <form id="form-login">
            <div class="mb-3">
              <label for="emailInput" class="form-label text-uppercase fw-semibold small"
                >CORREO:</label
              >
              <input
                type="email"
                class="form-control rounded-0 border-dark-subtle"
                id="emailInput"
                required />
            </div>

            <div class="mb-4">
              <label for="passwordInput" class="form-label text-uppercase fw-semibold small"
                >CONTRASEÑA:</label
              >
              <input
                type="password"
                class="form-control rounded-0 border-dark-subtle"
                id="passwordInput"
                required />
            </div>

            <div class="text-center mt-3 d-flex justify-content-center gap-2">
              <button id="boton-ingresar" type="submit" class="btn btn-primary">Ingresar</button>
              <a href="registro.html" class="btn btn-secondary">Registrarse</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
