<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GUAU&MIAU</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header
      class="navbar-header bg-light border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
      <a href="index.html" class="nav-link text-primary fw-bold">Inicio</a>
      <h1 class="h3 m-0 text-center flex-grow-1 fw-bold">GUAU&MIAU</h1>
      <a href="index.html" class="btn btn-dark text-uppercase px-3 fw-semibold">Iniciar Sesión</a>
    </header>

    <main class="d-flex justify-content-center align-items-center min-vh-75 py-5">
      <div class="card login-card border shadow-sm w-100" style="max-width: 450px">
        <div class="card-header text-center bg-secondary-subtle border-bottom py-2">
          <span class="fw-bold text-dark text-lowercase">inicio de sesión</span>
        </div>
        <div class="card-body p-4">
          <form>
            <div class="mb-3">
              <label
                for="emailInput"
                class="form-label text-uppercase fw-semibold small"
                >CORREO</label
              >
              <input
                type="email"
                class="form-control rounded-0 border-dark-subtle"
                id="emailInput"
                required
              />
            </div>

            <div class="mb-4">
              <label
                for="passwordInput"
                class="form-label text-uppercase fw-semibold small"
                >CONTRASEÑA</label
              >
              <input
                type="password"
                class="form-control rounded-0 border-dark-subtle"
                id="passwordInput"
                required
              />
            </div>

            <div class="text-center mt-3">
              <button type="submit" class="btn btn-outline-dark px-4 py-2 rounded-0">
                Iniciar sesión
              </button>
              <a href="registro.html">
                <button type="button" class="btn btn-secondary">Registrarse</button>
              </a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
