<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | Guau & Miau</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="assets/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="navbar-header bg-light border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <img src="assets/logo.png" alt="Logo" class="navbar-brand" width="48" height="48" style="margin-right: 10px;">
      <a class="navbar-brand" href="index.html">Guau & Miau</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Inicio</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="login.html">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="registro.html">Registro</a>
          </li>
        </ul>
      </div>
    </nav>
    </header>


    <main class="d-flex justify-content-center align-items-center min-vh-75 py-5">
      <div class="card login-card border shadow-sm w-100" style="max-width: 450px">
        <div class="card-header text-center bg-secondary-subtle border-bottom py-2">
          <span class="fw-bold text-dark">Registro</span>
        </div>
        <div class="card-body p-4">
        <form>
            <fieldset>
            <legend>Información del Dueño/a</legend>


            <label for="nombre" class="form-label fw-semibold small">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre" class="form-control rounded-0 border-dark-subtle"><br>

            <label for="email" class="form-label fw-semibold small">Correo electrónico:</label><br>
            <input type="email" class="form-control rounded-0 border-dark-subtle" id="emailInput" required/><br>

            <label for="password" class="form-label fw-semibold small">Contraseña:</label><br>
            <input type="password" id="password" name="password" class="form-control rounded-0 border-dark-subtle"><br>

            <label for="confirm_password" class="form-label fw-semibold small">Confirmar contraseña:</label><br>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control rounded-0 border-dark-subtle"><br>
            
            <label for="telefono" class="form-label fw-semibold small">Teléfono:</label><br>
            <input type="tel" id="telefono" name="telefono" class="form-control rounded-0 border-dark-subtle"><br>
            </fieldset>
            <br>
            <fieldset>
            <legend>Información de la mascota</legend>

            <label for="cantidad_mascotas">¿Cuántas mascotas desea registrar?</label><br>
            <input type="number" class="form-control rounded-0 border-dark-subtle" id="cantidad_mascotas" name="cantidad_mascotas" min="1" max="5" value="1"><br>

            <label for="especie" class="form-label fw-semibold small">Especie de mascota:</label><br>
                <select id="especie" class="form-control rounded-0 border-dark-subtle">
                    <optgroup label="Mamíferos">
                        <option value="perro">Perro</option>
                        <option value="gato">Gato</option>
                    </optgroup>
                    <optgroup label="Aves">
                        <option value="loro">Loro</option>
                        <option value="cuervo">Cuervo</option>
                        <option value="lechuza">Lechuza</option>
                    </optgroup>
                    <optgroup label="Roedores">
                        <option value="rata">Rata</option>
                        <option value="hamster">Hamster</option>        
                    </optgroup>
                    <optgroup label="Otros">
                        <option value="otro">Criatura misteriosa</option>
                    </optgroup>
                </select>
                <br>

            <label for="nom_mascota" class="form-label fw-semibold small">Nombre mascota #1:</label><br>
            <input type="text" id="nom_mascota" name="nom_mascota" class="form-control rounded-0 border-dark-subtle"><br>
            </fieldset>
            <div class="text-center mt-3">
                <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
        </form>


    </main>
  </body>
</html>
