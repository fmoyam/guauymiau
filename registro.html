<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | Guau & Miau</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link rel="stylesheet" href="assets/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/registro.js" defer></script>
  </head>
  <body>
        <header class="navbar-header bg-white border-bottom py-2 px-4 shadow-sm">
      <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid px-0">
          <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <img src="assets/logo.png" alt="Logo" width="40" height="40" />
            <span class="fw-bold text-dark">Guau & Miau</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active fw-semibold" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="login.html">Login</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="registro.html">Registro</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="d-flex justify-content-center align-items-center min-vh-75 py-5">
      <div class="card login-card border shadow-sm w-100" style="max-width: 500px">
        <div class="card-header text-center bg-secondary-subtle border-bottom py-2">
          <span class="fw-bold text-dark">Registro de Usuario</span>
        </div>
        <div class="card-body p-4">
          <form id="form-registro">
            <fieldset class="mb-4">
              <legend class="h6 text-primary fw-bold border-bottom pb-2 mb-3">
                Información del Dueño/a
              </legend>

              <div class="mb-3">
                <label for="nombreInput" class="form-label fw-semibold small"
                  >Nombre completo:</label
                >
                <input
                  type="text"
                  id="nombreInput"
                  class="form-control rounded-0 border-dark-subtle"
                  required />
              </div>

              <div class="mb-3">
                <label for="emailInput" class="form-label fw-semibold small"
                  >Correo electrónico:</label
                >
                <input
                  type="email"
                  id="emailInput"
                  class="form-control rounded-0 border-dark-subtle"
                  required />
              </div>

              <div class="mb-3">
                <label for="passwordInput" class="form-label fw-semibold small">Contraseña:</label>
                <input
                  type="password"
                  id="passwordInput"
                  class="form-control rounded-0 border-dark-subtle"
                  required />
              </div>

              <div class="mb-3">
                <label for="confirmPasswordInput" class="form-label fw-semibold small"
                  >Confirmar contraseña:</label
                >
                <input
                  type="password"
                  id="confirmPasswordInput"
                  class="form-control rounded-0 border-dark-subtle"
                  required />
              </div>

              <div class="mb-3">
                <label for="telefonoInput" class="form-label fw-semibold small">Teléfono:</label>
                <input
                  type="tel"
                  id="telefonoInput"
                  class="form-control rounded-0 border-dark-subtle"
                  required />
              </div>
            </fieldset>

            <fieldset class="mb-4">
              <legend class="h6 text-primary fw-bold border-bottom pb-2 mb-3">
                Información de la mascota
              </legend>

              <div class="mb-3">
                <label for="cantidad_mascotas" class="form-label fw-semibold small"
                  >¿Cuántas mascotas desea registrar? (1 a 5)</label
                >
                <input
                  type="number"
                  class="form-control rounded-0 border-dark-subtle"
                  id="cantidad_mascotas"
                  min="1"
                  max="5"
                  value="1" />
              </div>

              <div id="mascotas-container" class="d-flex flex-column gap-3"></div>
            </fieldset>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary w-100">Registrar</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
